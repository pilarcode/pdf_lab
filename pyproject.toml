[project]
name = "pdf-lab"
version = "0.1.0"
description = "Project to explore other libs to get data from PDFs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "easyocr>=1.7.2",
    "pdfminer>=20191125",
    "pdfplumber>=0.11.5",
    "pillow>=11.1.0",
    "protobuf>=6.30.1",
    "pymupdf>=1.25.4",
    "pypdf2>=3.0.1",
    "pypdfium2>=4.30.1",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.0.1",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.49.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "jupyter>=1.1.1",
    "llama-index>=0.12.24",
    "llama-index-core>=0.12.24.post1",
    "llama-index-llms-gemini>=0.4.11",
    "llama-parse>=0.6.4.post1",
]


